<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRY TO EXPLORE ARMENIA</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<main class="shell recipient">

<div class="brand">
  <span class="target">●</span>
  <div>
    <b>TRY TO EXPLORE</b>
    <small>ARMENIA</small>
  </div>
</div>

<section class="hero">

  <div class="eyebrow">PRIVATE EXPLORATION REQUEST</div>

  <h1>Where are we going?</h1>

  <p>
    Choose an option. Your location will only be requested
    after you press one of the green or yellow buttons.
  </p>

  <div id="msg" class="muted"></div>

  <button class="green choice" onclick="go('armenia')">
    <strong>EXPLORE ARMENIA</strong>
    <small>Ամբողջ Հայաստան</small>
  </button>

  <button class="yellow choice" onclick="go('yerevan')">
    <strong>EXPLORE YEREVAN</strong>
    <small>Միայն Երևան</small>
  </button>

  <button class="red choice" onclick="go('declined')">
    <strong>НИКУДА НЕ ИДЁМ</strong>
    <small>
      Ոչ մի տեղ չենք գնում, ոչ մի բան չենք ուզում բացահայտենք։
    </small>
  </button>

</section>

<section id="videoBox" class="videoBox" hidden>

  <div class="eyebrow">EXPLORATION VIDEO</div>

  <video
    id="video"
    playsinline
    controls
    preload="metadata">
  </video>

  <button id="play" class="darkbtn">
    ▶ PLAY VIDEO
  </button>

</section>

<section id="liveBox" class="card" hidden style="margin-top:16px">

  <div class="eyebrow">LIVE LOCATION</div>

  <strong id="liveStatus">LOCATION ACTIVE</strong>

  <div id="timer" class="muted" style="margin-top:6px">
    30:00
  </div>

</section>

</main>

<script>

const token = {{token|tojson}};

let watchId = null;
let liveStarted = false;
let liveUntil = 0;
let lastSent = 0;
let timerId = null;

function msg(t, err=false) {

  const x = document.getElementById('msg');

  x.textContent = t;
  x.className = err ? 'error' : 'muted';

}

function setButtonsDisabled(value) {

  document
    .querySelectorAll('.choice')
    .forEach(b => b.disabled = value);

}

async function sendInitialLocation(choice, p) {

  const payload = {

    choice: choice,

    latitude: p.coords.latitude,

    longitude: p.coords.longitude,

    accuracy: p.coords.accuracy,

    location_timestamp:
      new Date(
        p.timestamp || Date.now()
      ).toISOString()

  };

  const r = await fetch(
    `/api/r/${token}/respond`,
    {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    }
  );

  const d = await r.json();

  if (!r.ok) {

    msg(
      d.error ||
      'Տեղադրությունը չհաջողվեց փոխանցել։',
      true
    );

    setButtonsDisabled(false);

    return false;
  }

  const v = document.getElementById('video');

  v.src = '/static/media/' + d.video;

  document.getElementById('videoBox').hidden = false;

  try {

    await v.play();

  } catch(e) {

    document.getElementById('play').hidden = false;

  }

  document.getElementById('play').onclick = () => v.play();

  startLiveLocation();

  return true;

}

async function sendLocation(p) {

  const now = Date.now();

  if (now >= liveUntil) {

    stopLiveLocation();
    return;

  }

  // Սերվերին նոր դիրք ուղարկում ենք առավելագույնը 5 վայրկյանը մեկ

  if (now - lastSent < 5000) {
    return;
  }

  lastSent = now;

  const payload = {

    latitude: p.coords.latitude,

    longitude: p.coords.longitude,

    accuracy: p.coords.accuracy,

    location_timestamp:
      new Date(
        p.timestamp || now
      ).toISOString()

  };

  try {

    const r = await fetch(
      `/api/r/${token}/location`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      }
    );

    if (r.status === 410) {

      stopLiveLocation();

      return;

    }

  } catch(e) {

    console.log('Location update failed');

  }

}

function startLiveLocation() {

  if (liveStarted) return;

  liveStarted = true;

  liveStarted = true;

  liveUntil = Date.now() + (30 * 60 * 1000);

  document.getElementById('liveBox').hidden = false;

  msg('Տեղադրությունը ուղիղ փոխանցվում է։');

  watchId = navigator.geolocation.watchPosition(

    p => {

      sendLocation(p);

    },

    e => {

      console.log('Live location error', e);

    },

    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 5000
    }

  );

  timerId = setInterval(updateTimer, 1000);

  updateTimer();

}

function updateTimer() {

  const remaining =
    Math.max(
      0,
      liveUntil - Date.now()
    );

  const totalSeconds =
    Math.ceil(remaining / 1000);

  const minutes =
    Math.floor(totalSeconds / 60);

  const seconds =
    totalSeconds % 60;

  document.getElementById('timer').textContent =
    String(minutes).padStart(2,'0') +
    ':' +
    String(seconds).padStart(2,'0');

  if (remaining <= 0) {

    stopLiveLocation();

  }

}

function stopLiveLocation() {

  if (watchId !== null) {

    navigator.geolocation.clearWatch(watchId);

    watchId = null;

  }

  if (timerId !== null) {

    clearInterval(timerId);

    timerId = null;

  }

  document.getElementById('liveStatus').textContent =
    'LOCATION SESSION FINISHED';

  document.getElementById('timer').textContent =
    '00:00';

  msg('Տեղադրության փոխանցումն ավարտվեց։');

}

async function go(choice) {

  setButtonsDisabled(true);

  if (choice === 'declined') {

    const r = await fetch(
      `/api/r/${token}/respond`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          choice
        })
      }
    );

    msg(
      r.ok
        ? 'Պարզ է։ Ոչ մի տեղ չենք գնում։'
        : 'Հղումը այլևս հասանելի չէ։'
    );

    return;

  }

  msg(
    'Խնդրում ենք հաստատել տեղադրության թույլտվությունը…'
  );

  if (!navigator.geolocation) {

    msg(
      'Այս դիտարկիչը չի աջակցում տեղադրության որոշմանը։',
      true
    );

    setButtonsDisabled(false);

    return;

  }

  navigator.geolocation.getCurrentPosition(

    async p => {

      await sendInitialLocation(choice, p);

    },

    e => {

      const messages = {

        1: 'Տեղադրության թույլտվությունը մերժվել է։',

        2: 'Տեղադրությունը հասանելի չէ։',

        3: 'Տեղադրության հարցումը ժամկետանց է։'

      };

      msg(
        messages[e.code] ||
        'Չհաջողվեց ստանալ տեղադրությունը։',
        true
      );

      setButtonsDisabled(false);

    },

    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }

  );

}

</script>

</body>
</html>
